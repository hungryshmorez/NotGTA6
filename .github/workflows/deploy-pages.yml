name: Deploy to GitHub Pages

# Publishes the static site (repo root) to GitHub Pages. The game is a
# zero-dependency client-side SPA, so no build step is needed — we just upload
# the repository as the Pages artifact.

on:
  push:
    branches:
      - main
      - claude/uls-production-engine-3pyhf0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; newest wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
